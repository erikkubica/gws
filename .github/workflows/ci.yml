name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Verify module dependencies
        run: go mod verify

      - name: Check code formatting (gofmt)
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "The following files are not formatted with gofmt -s:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run static analysis (go vet)
        run: go vet ./...

      - name: Set up Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome check
        run: biome check plugin/

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Build binary
        run: go build -v ./cmd/gws
